name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v0.1.8)'
        required: false
        default: 'v0.1.8'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 🐧 Ubuntu / Linux Job: Builds .deb and .tar.gz with Version Suffix
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux Packages (.deb & .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag_name || 'v0.1.8' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release

      - name: Build Debian .deb Package
        run: |
          cargo deb --no-build
          cp target/debian/*.deb ./mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-amd64.deb
          sha256sum mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-amd64.deb > mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-amd64.deb.sha256

      - name: Build Portable .tar.gz
        run: |
          cd target/release
          tar -czf ../../mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-x86_64.tar.gz mukalujauh
          cd ../..
          sha256sum mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-x86_64.tar.gz > mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-x86_64.tar.gz.sha256

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-amd64.deb
            mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-amd64.deb.sha256
            mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-x86_64.tar.gz
            mukalujauh-${{ steps.release_tag.outputs.tag }}-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 🪟 Windows Job: Builds NSIS .exe Setup Installer & .zip with Version Suffix
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows Packages (.exe Setup & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo "$nsisPath" >> $env:GITHUB_PATH
          }

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag_name || 'v0.1.8' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release

      - name: Build NSIS Setup Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging\windows\installer.nsi
          Move-Item mukalujauh-windows-x86_64-installer.exe mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64-setup.exe
          Get-FileHash -Algorithm SHA256 mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64-setup.exe | ForEach-Object { "$($_.Hash)  mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64-setup.exe" } | Out-File -Encoding ascii mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64-setup.exe.sha256

      - name: Build Portable .zip
        shell: pwsh
        run: |
          cd target\release
          Compress-Archive -Path mukalujauh.exe -DestinationPath ..\..\mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64.zip
          cd ..\..
          Get-FileHash -Algorithm SHA256 mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64.zip | ForEach-Object { "$($_.Hash)  mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64.zip" } | Out-File -Encoding ascii mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64.zip.sha256

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64-setup.exe
            mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64-setup.exe.sha256
            mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64.zip
            mukalujauh-${{ steps.release_tag.outputs.tag }}-windows-x86_64.zip.sha256
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 🍎 macOS Job: Builds .dmg Disk Image & .tar.gz with Version Suffix
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS Packages (.dmg & .tar.gz)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag_name || 'v0.1.8' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build macOS DMG Disk Image
        run: |
          mkdir -p dmg_root
          cp target/aarch64-apple-darwin/release/mukalujauh dmg_root/
          cp README.md dmg_root/
          hdiutil create -volname "MukaLuJauh" -srcfolder dmg_root -ov -format UDZO mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.dmg
          shasum -a 256 mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.dmg > mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.dmg.sha256

      - name: Build Portable .tar.gz
        run: |
          cd target/aarch64-apple-darwin/release
          tar -czf ../../../mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.tar.gz mukalujauh
          cd ../../..
          shasum -a 256 mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.tar.gz > mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.tar.gz.sha256

      - name: Upload macOS Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.dmg
            mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.dmg.sha256
            mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.tar.gz
            mukalujauh-${{ steps.release_tag.outputs.tag }}-macos-arm64.tar.gz.sha256
          draft: false
          prerelease: false

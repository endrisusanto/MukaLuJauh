[package]
name = "mukalujauh"
version = "0.1.3"
edition = "2021"
authors = ["Endri Susanto <endri@example.com>"]
description = "Fast, privacy-first Face Unlock for Linux (Ubuntu) & Windows inspired by Glance"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rpassword = "7.3"
directories = "5.0"

# Target specific dependencies for Linux
[target.'cfg(target_os = "linux")'.dependencies]
# Optional PAM or DBus systemd-logind integrations

# Target specific dependencies for Windows
[target.'cfg(windows)'.dependencies]
# Windows API bindings for session lock notifications
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "mukalujauh"
path = "src/main.rs"

# Debian / Ubuntu .deb package metadata
[package.metadata.deb]
maintainer = "Endri Susanto <endri@example.com>"
copyright = "2026 Endri Susanto"
license-file = ["LICENSE", "4"]
extended-description = """\
Fast, privacy-first Face Unlock for Linux (Ubuntu/Debian) & Windows inspired by Glance.
Uses on-device face embedding matching with liveness anti-spoofing detection."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/mukalujauh", "usr/local/bin/mukalujauh", "755"],
    ["README.md", "usr/share/doc/mukalujauh/README", "644"],
]

# Fedora / RHEL .rpm package metadata
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mukalujauh", dest = "/usr/local/bin/mukalujauh", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/mukalujauh/README.md", mode = "644" }
]
